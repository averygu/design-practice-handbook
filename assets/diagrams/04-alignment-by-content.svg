<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1160" viewBox="0 0 1200 1160" role="img" aria-labelledby="title desc">
<title id="title">文字、数量与编号，使用不同的对齐判断</title><desc id="desc">表格含任务编号001、014和102，名称、状态以及录音时长8.0、12.5和9.0秒。编号保留前导零，名称与状态左对齐；同单位同精度的时长采用等宽数字右对齐。打开录音入口始终有文字和下划线。</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif}.number{font-family:Menlo,monospace}</style>
<rect width="1200" height="1160" fill="#f6f7f3"/>
<text x="48" y="52" font-size="17" font-weight="700" fill="#315e54" text-anchor="start">图 12 · 原创示意 / 阅读与文字</text>
<text x="48" y="106" font-size="36" font-weight="700" fill="#203c3b" text-anchor="start">文字、数量与编号，使用不同的对齐判断</text>
<text x="48" y="148" font-size="21" font-weight="400" fill="#526a65" text-anchor="start">原创录音任务表 · 时长来自假设的十分之一秒记录，仅为展示格式。</text>
<rect x="48" y="218" width="1104" height="450" rx="12" fill="white" stroke="#c8d4cb"/>
<text x="76" y="270" font-size="21" font-weight="700" fill="#203c3b" text-anchor="start">编号</text>
<text x="212" y="270" font-size="21" font-weight="700" fill="#203c3b" text-anchor="start">练习任务</text>
<text x="640" y="270" font-size="21" font-weight="700" fill="#203c3b" text-anchor="start">状态</text>
<text x="902" y="270" font-size="21" font-weight="700" fill="#203c3b" text-anchor="end">时长（秒）</text>
<text x="978" y="270" font-size="21" font-weight="700" fill="#203c3b" text-anchor="start">操作</text>
<line x1="76" y1="296" x2="1124" y2="296" stroke="#c8d4cb" stroke-width="1"/>
<text class="number" x="76" y="362" text-anchor="start" font-size="24" fill="#203c3b">001</text>
<text x="212" y="362" font-size="24" font-weight="400" fill="#203c3b" text-anchor="start">解释一次选择</text>
<text x="640" y="362" font-size="22" font-weight="400" fill="#203c3b" text-anchor="start">待反馈</text>
<text class="number" x="902" y="362" text-anchor="end" font-size="24" fill="#203c3b">8.0</text>
<text x="978" y="362" font-size="21" font-weight="500" fill="#315e54" text-anchor="start">打开录音</text>
<line x1="978" y1="367" x2="1062" y2="367" stroke="#315e54" stroke-width="1.5"/>
<line x1="76" y1="406" x2="1124" y2="406" stroke="#c8d4cb" stroke-width="1"/>
<text class="number" x="76" y="482" text-anchor="start" font-size="24" fill="#203c3b">014</text>
<text x="212" y="482" font-size="24" font-weight="400" fill="#203c3b" text-anchor="start">补充一个理由</text>
<text x="640" y="482" font-size="22" font-weight="400" fill="#203c3b" text-anchor="start">可重试</text>
<text class="number" x="902" y="482" text-anchor="end" font-size="24" fill="#203c3b">12.5</text>
<text x="978" y="482" font-size="21" font-weight="500" fill="#315e54" text-anchor="start">打开录音</text>
<line x1="978" y1="487" x2="1062" y2="487" stroke="#315e54" stroke-width="1.5"/>
<line x1="76" y1="526" x2="1124" y2="526" stroke="#c8d4cb" stroke-width="1"/>
<text class="number" x="76" y="602" text-anchor="start" font-size="24" fill="#203c3b">102</text>
<text x="212" y="602" font-size="24" font-weight="400" fill="#203c3b" text-anchor="start">给例子补上结论</text>
<text x="640" y="602" font-size="22" font-weight="400" fill="#203c3b" text-anchor="start">已处理</text>
<text class="number" x="902" y="602" text-anchor="end" font-size="24" fill="#203c3b">9.0</text>
<text x="978" y="602" font-size="21" font-weight="500" fill="#315e54" text-anchor="start">打开录音</text>
<line x1="978" y1="607" x2="1062" y2="607" stroke="#315e54" stroke-width="1.5"/>
<text x="48" y="730" font-size="26" font-weight="700" fill="#203c3b" text-anchor="start">先确定在比较什么，再统一显示方式</text>
<rect x="48" y="766" width="352" height="206" rx="12" fill="#e9f0ea" stroke="#e9f0ea"/>
<text x="72" y="810" font-size="25" font-weight="700" fill="#203c3b" text-anchor="start">文字</text>
<text x="72" y="862" font-size="21" font-weight="400" fill="#203c3b" text-anchor="start">给长名称留出换行空间</text>
<text x="72" y="905" font-size="21" font-weight="400" fill="#203c3b" text-anchor="start">不为等高删掉必要条件</text>
<rect x="424" y="766" width="352" height="206" rx="12" fill="#e9f0ea" stroke="#e9f0ea"/>
<text x="448" y="810" font-size="25" font-weight="700" fill="#203c3b" text-anchor="start">标识符</text>
<text x="448" y="862" font-size="21" font-weight="400" fill="#203c3b" text-anchor="start">保留001这样的编号</text>
<text x="448" y="905" font-size="21" font-weight="400" fill="#203c3b" text-anchor="start">不当成可以去零的数量</text>
<rect x="800" y="766" width="352" height="206" rx="12" fill="#e9f0ea" stroke="#e9f0ea"/>
<text x="824" y="810" font-size="25" font-weight="700" fill="#203c3b" text-anchor="start">可比较的数量</text>
<text x="824" y="862" font-size="21" font-weight="400" fill="#203c3b" text-anchor="start">先核单位与记录精度</text>
<text x="824" y="905" font-size="21" font-weight="400" fill="#203c3b" text-anchor="start">再检查数位与小数点</text>
<text x="48" y="1026" font-size="21" font-weight="400" fill="#203c3b" text-anchor="start">右对齐不自动统一小数位；视觉表格也不能替代真实表头与数据关系。</text>
<line x1="48" y1="1088" x2="1152" y2="1088" stroke="#c8d4cb" stroke-width="1"/>
<text x="48" y="1124" font-size="17" font-weight="400" fill="#526a65" text-anchor="start">原创教学示意 · 图中尺寸不是通用规格 · 未证明产品、无障碍符合性或学习效果</text>
</svg>
