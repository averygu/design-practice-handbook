<circle cx="158" cy="773" r="16" fill="#315e54"/>
<text x="158" y="779" font-size="18" font-weight="700" fill="white" text-anchor="middle">1</text>
<text x="316" y="267" font-size="28" font-weight="700" fill="#203c3b" text-anchor="start">比较两条答案</text>
<text x="316" y="307" font-size="20" font-weight="400" fill="#526a65" text-anchor="start">当前练习：补出原因</text>
<line x1="268" y1="345" x2="316" y2="345" stroke="#315e54" stroke-width="2"/>
<line x1="268" y1="340" x2="268" y2="350" stroke="#315e54" stroke-width="2"/>
<line x1="316" y1="340" x2="316" y2="350" stroke="#315e54" stroke-width="2"/>
<circle cx="292" cy="381" r="16" fill="#315e54"/>
<text x="292" y="387" font-size="18" font-weight="700" fill="white" text-anchor="middle">2</text>
<rect x="316" y="350" width="376" height="230" rx="12" fill="white" stroke="#c8d4cb"/>
<rect x="716" y="350" width="376" height="230" rx="12" fill="white" stroke="#c8d4cb"/>
<text x="344" y="399" font-size="22" font-weight="700" fill="#203c3b" text-anchor="start">回答 A</text>
<text x="344" y="452" font-size="24" font-weight="400" fill="#203c3b" text-anchor="start">它展示了人物作出</text>
<text x="344" y="490" font-size="24" font-weight="400" fill="#203c3b" text-anchor="start">决定的过程。</text>
<text x="344" y="550" font-size="19" font-weight="500" fill="#315e54" text-anchor="start">查看原题</text>
<text x="744" y="399" font-size="22" font-weight="700" fill="#203c3b" text-anchor="start">回答 B</text>
<text x="744" y="452" font-size="24" font-weight="400" fill="#203c3b" text-anchor="start">它让读者看到选择</text>
<text x="744" y="490" font-size="24" font-weight="400" fill="#203c3b" text-anchor="start">带来的后果。</text>
<text x="744" y="550" font-size="19" font-weight="500" fill="#315e54" text-anchor="start">查看原题</text>
