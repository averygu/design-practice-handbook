<text x="767" y="346" font-size="18" font-weight="700" fill="white" text-anchor="middle">5</text>
<line x1="1118" y1="582" x2="1118" y2="628" stroke="#315e54" stroke-width="2"/>
<line x1="1113" y1="582" x2="1123" y2="582" stroke="#315e54" stroke-width="2"/>
<line x1="1113" y1="628" x2="1123" y2="628" stroke="#315e54" stroke-width="2"/>
<circle cx="1118" cy="606" r="16" fill="#315e54"/>
<text x="1118" y="612" font-size="18" font-weight="700" fill="white" text-anchor="middle">3</text>
<rect x="316" y="630" width="776" height="142" rx="12" fill="#e9f0ea" stroke="#e9f0ea"/>
<text x="344" y="676" font-size="23" font-weight="700" fill="#203c3b" text-anchor="start">共同问题</text>
<text x="344" y="719" font-size="23" font-weight="400" fill="#203c3b" text-anchor="start">两条回答是否都把原因说具体了？</text>
<text x="48" y="866" font-size="26" font-weight="700" fill="#203c3b" text-anchor="start">分别调整，才知道改变了什么</text>
<circle cx="66" cy="918" r="16" fill="#315e54"/>
<text x="66" y="924" font-size="18" font-weight="700" fill="white" text-anchor="middle">1</text>
<text x="94" y="924" font-size="23" font-weight="700" fill="#203c3b" text-anchor="start">导航宽度</text>
<text x="94" y="960" font-size="19" font-weight="400" fill="#526a65" text-anchor="start">需要持续切换时才保留</text>
<circle cx="436" cy="918" r="16" fill="#315e54"/>
<text x="436" y="924" font-size="18" font-weight="700" fill="white" text-anchor="middle">2</text>
<text x="464" y="924" font-size="23" font-weight="700" fill="#203c3b" text-anchor="start">主区内边距</text>
<text x="464" y="960" font-size="19" font-weight="400" fill="#526a65" text-anchor="start">给内容稳定的起始边界</text>
<circle cx="806" cy="918" r="16" fill="#315e54"/>
<text x="806" y="924" font-size="18" font-weight="700" fill="white" text-anchor="middle">3</text>
<text x="834" y="924" font-size="23" font-weight="700" fill="#203c3b" text-anchor="start">区块间距</text>
<text x="834" y="960" font-size="19" font-weight="400" fill="#526a65" text-anchor="start">比较区与讲评区分开</text>
<circle cx="66" cy="1012" r="16" fill="#315e54"/>
<text x="66" y="1018" font-size="18" font-weight="700" fill="white" text-anchor="middle">4</text>
<text x="94" y="1018" font-size="23" font-weight="700" fill="#203c3b" text-anchor="start">同组间距</text>
<text x="94" y="1054" font-size="19" font-weight="400" fill="#526a65" text-anchor="start">两条答案仍属于同一组</text>
<circle cx="436" cy="1012" r="16" fill="#315e54"/>
<text x="436" y="1018" font-size="18" font-weight="700" fill="white" text-anchor="middle">5</text>
<text x="464" y="1018" font-size="23" font-weight="700" fill="#203c3b" text-anchor="start">组件内边距</text>
<text x="464" y="1054" font-size="19" font-weight="400" fill="#526a65" text-anchor="start">让文字与边框保持距离</text>
<line x1="48" y1="1108" x2="1152" y2="1108" stroke="#c8d4cb" stroke-width="1"/>
<text x="48" y="1144" font-size="17" font-weight="400" fill="#526a65" text-anchor="start">原创场景与构图 · 尺寸只用于说明关系 · 不是已测产品或学习效果证据</text>
