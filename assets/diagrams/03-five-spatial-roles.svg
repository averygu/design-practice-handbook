<text x="72" y="326" font-size="21" font-weight="400" fill="#203c3b" text-anchor="start">1  找出主张</text>
<rect x="64" y="350" width="188" height="53" rx="8" fill="white" stroke="#315e54"/>
<text x="80" y="384" font-size="21" font-weight="650" fill="#203c3b" text-anchor="start">2  补出原因</text>
<text x="72" y="444" font-size="21" font-weight="400" fill="#203c3b" text-anchor="start">3  检查例证</text>
<text x="72" y="504" font-size="21" font-weight="400" fill="#203c3b" text-anchor="start">4  完成改写</text>
<line x1="48" y1="740" x2="268" y2="740" stroke="#315e54" stroke-width="2"/>
<line x1="48" y1="735" x2="48" y2="745" stroke="#315e54" stroke-width="2"/>
