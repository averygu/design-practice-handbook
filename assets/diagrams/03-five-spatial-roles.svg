<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1180" viewBox="0 0 1200 1180" role="img" aria-labelledby="title desc">
<title id="title">五类空间，各自承担不同工作</title><desc id="desc">练习导航位于左侧，主区域包含待比较的两条答案和下方共同问题。五个标注分别指向导航宽度、主内容内边距、区块间距、同组答案间距及答案内部内边距。</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif}</style>
<rect width="1200" height="1180" fill="#f6f7f3"/>
<text x="48" y="52" font-size="17" font-weight="700" fill="#315e54" text-anchor="start">图 08 · 原创示意 / 布局与密度</text>
<text x="48" y="106" font-size="36" font-weight="700" fill="#203c3b" text-anchor="start">五类空间，各自承担不同工作</text>
<text x="48" y="148" font-size="21" font-weight="400" fill="#526a65" text-anchor="start">以教师比较两条练习答案为例；编号是空间角色，不是像素数值。</text>
<rect x="48" y="218" width="1104" height="586" rx="12" fill="white" stroke="#c8d4cb"/>
<rect x="48" y="218" width="220" height="586" rx="12" fill="#e9f0ea" stroke="#e9f0ea"/>
