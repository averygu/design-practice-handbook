<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">比较方式决定结论能走多远</title><desc id="desc">三列分别呈现真实任务观察、先后比较和随机比较，每列列出能回答的问题与不可跨越的结论边界。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#43655b"/></marker></defs>
<style>text{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#23362f}.title{font-size:32px;font-weight:650}.sub{font-size:21px;fill:#52635a}.head{font-size:25px;font-weight:600}.body{font-size:22px}.small{font-size:19px;fill:#52635a}.tag{font-size:17px;fill:#49655b;font-weight:600}</style>
<rect width="1200" height="800" fill="#f6f7f2"/>
<text x="48" y="62" class="title">比较方式决定结论能走多远</text>
<text x="48" y="104" class="sub">原创机制示意 · 方案草稿 · 未运行实验</text>
<rect x="48" y="158" width="344" height="458" rx="16" fill="#ffffff" stroke="#bec8c3" stroke-width="2"/>
<text x="72" y="201" class="head">任务观察</text>
<text x="72" y="254" class="body">给任务，观察过程</text>
<text x="72" y="290" class="body">记录误解、绕路、失败</text>
<text x="72" y="364" class="tag">适合回答</text>
<text x="72" y="407" class="body">问题怎样发生？</text>
<text x="72" y="485" class="tag">结论边界</text>
<text x="72" y="528" class="body">少量试用不能直接</text>
<text x="72" y="564" class="body">估计全体成功比例</text>
<rect x="428" y="158" width="344" height="458" rx="16" fill="#ffffff" stroke="#bec8c3" stroke-width="2"/>
<text x="452" y="201" class="head">先后比较</text>
<text x="452" y="254" class="body">旧时段 → 新时段</text>
<text x="452" y="290" class="body">条件和人群可能同变</text>
<text x="452" y="364" class="tag">适合回答</text>
<text x="452" y="407" class="body">结果怎样随时间变化？</text>
<text x="452" y="485" class="tag">结论边界</text>
<text x="452" y="528" class="body">不能把所有变化</text>
<text x="452" y="564" class="body">都归因于这次改版</text>
<rect x="808" y="158" width="344" height="458" rx="16" fill="#ffffff" stroke="#bec8c3" stroke-width="2"/>
<text x="832" y="201" class="head">随机比较</text>
<text x="832" y="254" class="body">先定义分配单位</text>
<text x="832" y="290" class="body">再分配条件、测量结果</text>
<text x="832" y="364" class="tag">适合回答</text>
<text x="832" y="407" class="body">方案是否带来结果差异？</text>
<text x="832" y="485" class="tag">结论边界</text>
<text x="832" y="528" class="body">仍需核分配、缺失、</text>
<text x="832" y="564" class="body">样本与分析是否可靠</text>
<text x="48" y="686" class="body">三种方法按问题选择，并非所有任务都要运行 A/B 实验。</text>
<text x="48" y="732" class="small">同时改变多个因素时，比较结果首先针对整个方案组合。</text>
</svg>
