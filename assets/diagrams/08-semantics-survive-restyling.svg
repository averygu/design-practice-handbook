<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
<title id="title">改变外观，保留对象真正的含义</title><desc id="desc">上方导航中反馈记录以文字和下划线标识当前页。中间练习方式用两个有文字标签的单选卡片，第一项带实心圆和已选说明。下方课程介绍有装饰性顶线与三条能力说明，刻意不用完成勾暗示学习进度。</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif}</style>
<rect width="1200" height="1200" fill="#f6f7f3"/>
<text x="48" y="52" font-size="17" font-weight="700" fill="#315e54" text-anchor="start">图 24 · 原创示意 / 收尾与真实状态</text>
<text x="48" y="106" font-size="36" font-weight="700" fill="#203c3b" text-anchor="start">改变外观，保留对象真正的含义</text>
<text x="48" y="148" font-size="21" font-weight="400" fill="#526a65" text-anchor="start">当前页面、单项选择与装饰强调不是同一种状态；先分清再润色。</text>
<rect x="48" y="218" width="1104" height="180" rx="12" fill="white" stroke="#c8d4cb"/>
<text x="76" y="261" font-size="24" font-weight="700" fill="#203c3b" text-anchor="start">页面导航</text>
<text x="76" y="321" font-size="23" font-weight="400" fill="#203c3b" text-anchor="start">课程概览</text>
<text x="268" y="321" font-size="23" font-weight="700" fill="#315e54" text-anchor="start">反馈记录</text>
<text x="460" y="321" font-size="23" font-weight="400" fill="#203c3b" text-anchor="start">资料库</text>
<line x1="268" y1="338" x2="360" y2="338" stroke="#315e54" stroke-width="3"/>
<text x="780" y="273" font-size="24" font-weight="700" fill="#203c3b" text-anchor="start">当前页</text>
<text x="780" y="316" font-size="22" font-weight="400" fill="#526a65" text-anchor="start">说明所在位置，</text>
<text x="780" y="352" font-size="22" font-weight="400" fill="#526a65" text-anchor="start">与键盘焦点分别处理。</text>
<rect x="48" y="430" width="1104" height="322" rx="12" fill="white" stroke="#c8d4cb"/>
<text x="76" y="474" font-size="24" font-weight="700" fill="#203c3b" text-anchor="start">练习方式 · 选择一项</text>
<rect x="76" y="510" width="312" height="180" rx="10" fill="#e9f0ea" stroke="#315e54"/>
<circle cx="102" cy="544" r="11" fill="white" stroke="#315e54" stroke-width="2"/>
<circle cx="102" cy="544" r="5" fill="#315e54"/>
<text x="127" y="551" font-size="24" font-weight="650" fill="#203c3b" text-anchor="start">独立练习</text>
<text x="100" y="597" font-size="20" font-weight="400" fill="#526a65" text-anchor="start">先作答，再查看提示</text>
<text x="100" y="655" font-size="19" font-weight="650" fill="#315e54" text-anchor="start">已选</text>
<rect x="420" y="510" width="312" height="180" rx="10" fill="white" stroke="#c8d4cb"/>
<circle cx="446" cy="544" r="11" fill="white" stroke="#315e54" stroke-width="2"/>
<text x="471" y="551" font-size="24" font-weight="650" fill="#203c3b" text-anchor="start">提示后练习</text>
<text x="444" y="597" font-size="20" font-weight="400" fill="#526a65" text-anchor="start">先看提示，再尝试作答</text>
<text x="780" y="526" font-size="24" font-weight="700" fill="#203c3b" text-anchor="start">单项选择</text>
<text x="780" y="568" font-size="21" font-weight="400" fill="#526a65" text-anchor="start">卡片需要名称、组关系</text>
<text x="780" y="606" font-size="21" font-weight="400" fill="#526a65" text-anchor="start">与真实可操作的状态。</text>
<text x="780" y="654" font-size="20" font-weight="400" fill="#526a65" text-anchor="start">绘出圆圈，不等于实现控件。</text>
<rect x="48" y="784" width="1104" height="288" rx="12" fill="white" stroke="#c8d4cb"/>
<rect x="48" y="784" width="1104" height="5" rx="0" fill="#315e54" stroke="#315e54"/>
<text x="76" y="833" font-size="24" font-weight="700" fill="#203c3b" text-anchor="start">课程会练习什么</text>
<text x="76" y="881" font-size="23" font-weight="400" fill="#203c3b" text-anchor="start">—  理解观点之间的关系</text>
<text x="76" y="925" font-size="23" font-weight="400" fill="#203c3b" text-anchor="start">—  解释理由与证据的联系</text>
<text x="76" y="969" font-size="23" font-weight="400" fill="#203c3b" text-anchor="start">—  修改不够具体的表达</text>
<text x="780" y="830" font-size="24" font-weight="700" fill="#203c3b" text-anchor="start">装饰强调</text>
<text x="780" y="872" font-size="22" font-weight="400" fill="#526a65" text-anchor="start">顶线帮助组织视觉，</text>
<text x="780" y="910" font-size="22" font-weight="400" fill="#526a65" text-anchor="start">不表示已选或已完成。</text>
<text x="780" y="958" font-size="20" font-weight="400" fill="#526a65" text-anchor="start">能力介绍也不是学习记录。</text>
<line x1="48" y1="1128" x2="1152" y2="1128" stroke="#c8d4cb" stroke-width="1"/>
<text x="48" y="1164" font-size="17" font-weight="400" fill="#526a65" text-anchor="start">原创场景与文案 · 静态示意，不代表真实产品、用户记录或无障碍验收</text>
</svg>
