<text x="78" y="677" font-size="19" font-weight="400" fill="#526a65" text-anchor="start">标题与相邻说明的归属需要再判断</text>
<text x="654" y="677" font-size="19" font-weight="400" fill="#526a65" text-anchor="start">标题贴近自己的说明，两组有分隔</text>
