<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">一项指标需要一份明确的约定</title><desc id="desc">从期望结果到可观察表现，再到计数口径。失败护栏跨越各项，错误和未知不能被增长数字遮住。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#43655b"/></marker></defs>
<style>text{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#23362f}.title{font-size:32px;font-weight:650}.sub{font-size:21px;fill:#52635a}.head{font-size:25px;font-weight:600}.body{font-size:22px}.small{font-size:19px;fill:#52635a}.tag{font-size:17px;fill:#49655b;font-weight:600}</style>
<rect width="1200" height="800" fill="#f6f7f2"/>
<text x="48" y="62" class="title">一项指标需要一份明确的约定</text>
<text x="48" y="104" class="sub">原创机制示意 · 方案草稿 · 未运行实验</text>
<rect x="48" y="158" width="330" height="260" rx="16" fill="#ffffff" stroke="#bec8c3" stroke-width="2"/>
<text x="72" y="199" class="head">期望结果</text>
<text x="72" y="249" class="body">拿到内容正确的文件</text>
<text x="72" y="285" class="body">并知道结果在哪里</text>
<text x="72" y="380" class="small">先定义人要完成什么</text>
<rect x="435" y="158" width="330" height="260" rx="16" fill="#ffffff" stroke="#bec8c3" stroke-width="2"/>
<text x="459" y="199" class="head">可观察表现</text>
<text x="459" y="249" class="body">找到 → 打开 → 核对</text>
<text x="459" y="285" class="body">与所选范围相符</text>
<text x="459" y="380" class="small">点击不能代替任务完成</text>
<rect x="822" y="158" width="330" height="260" rx="16" fill="#ffffff" stroke="#bec8c3" stroke-width="2"/>
<text x="846" y="199" class="head">计数口径</text>
<text x="846" y="249" class="body">确认成功 / 有效开始</text>
<text x="846" y="285" class="body">单位、时间窗、重试</text>
<text x="846" y="321" class="body">失败和未知分别保留</text>
<text x="846" y="380" class="small">变化前后保持可比较</text>
<path d="M382,287 L426,287" fill="none" stroke="#43655b" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M769,287 L813,287" fill="none" stroke="#43655b" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="48" y="476" width="1104" height="174" rx="16" fill="#eaf1ed" stroke="#8ea99a" stroke-width="2"/>
<text x="72" y="518" class="head">失败护栏贯穿整次判断</text>
<text x="72" y="560" class="body">内容错配、丢失或恢复失败：先处理；不由更高完成率抵消。</text>
<text x="72" y="598" class="body">条件改变或记录缺失：说明影响，不能把未知默认为成功。</text>
<text x="48" y="721" class="small">箭头表示测量设计的顺序，不表示已验证的因果关系。</text>
</svg>
