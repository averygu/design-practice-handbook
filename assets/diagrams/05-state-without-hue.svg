<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1040" viewBox="0 0 1200 1040" role="img" aria-labelledby="title desc">
<title id="title">去掉色相，状态仍应说得清</title><desc id="desc">三行分别为草稿已保存、已提交、提交失败。每种状态都有不同形状符号、明确名称和说明。在有色和中性色两列中，文字和符号保持相同。</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif}</style>
<rect width="1200" height="1040" fill="#f6f7f3"/>
<text x="48" y="52" font-size="17" font-weight="700" fill="#315e54" text-anchor="start">图 15 · 原创示意 / 颜色与状态</text>
<text x="48" y="106" font-size="36" font-weight="700" fill="#203c3b" text-anchor="start">去掉色相，状态仍应说得清</text>
<text x="48" y="150" font-size="21" font-weight="400" fill="#526a65" text-anchor="start">左右状态文字与符号一致；右侧采用统一中性色，不模拟任何一种色觉体验。</text>
<text x="48" y="211" font-size="25" font-weight="700" fill="#203c3b" text-anchor="start">有颜色：辅助定位</text>
<text x="624" y="211" font-size="25" font-weight="700" fill="#203c3b" text-anchor="start">统一中性色：核对信息</text>
<rect x="48" y="244" width="528" height="151" rx="12" fill="#e9f0ea" stroke="#315e54"/>
<circle cx="90" cy="292" r="18" fill="none" stroke="#315e54" stroke-width="3"/>
<path d="M 81 292 l 6 7 l 13 -14" fill="none" stroke="#315e54" stroke-width="3"/>
<text x="128" y="302" font-size="29" font-weight="700" fill="#315e54" text-anchor="start">草稿已保存</text>
<text x="72" y="355" font-size="23" font-weight="400" fill="#315e54" text-anchor="start">保存在这台设备，尚未提交。</text>
<rect x="624" y="244" width="528" height="151" rx="12" fill="#efefef" stroke="#303030"/>
<circle cx="666" cy="292" r="18" fill="none" stroke="#303030" stroke-width="3"/>
<path d="M 657 292 l 6 7 l 13 -14" fill="none" stroke="#303030" stroke-width="3"/>
<text x="704" y="302" font-size="29" font-weight="700" fill="#303030" text-anchor="start">草稿已保存</text>
<text x="648" y="355" font-size="23" font-weight="400" fill="#303030" text-anchor="start">保存在这台设备，尚未提交。</text>
<rect x="48" y="427" width="528" height="151" rx="12" fill="#edf5fb" stroke="#285f8a"/>
<rect x="72" y="457" width="36" height="36" rx="4" fill="none" stroke="#285f8a" stroke-width="3"/>
<path d="M 80 475 h 20 m -8 -8 l 8 8 l -8 8" fill="none" stroke="#285f8a" stroke-width="3"/>
<text x="128" y="485" font-size="29" font-weight="700" fill="#285f8a" text-anchor="start">已提交</text>
<text x="72" y="538" font-size="23" font-weight="400" fill="#285f8a" text-anchor="start">系统已确认接收，可查看提交记录。</text>
<rect x="624" y="427" width="528" height="151" rx="12" fill="#efefef" stroke="#303030"/>
<rect x="648" y="457" width="36" height="36" rx="4" fill="none" stroke="#303030" stroke-width="3"/>
<path d="M 656 475 h 20 m -8 -8 l 8 8 l -8 8" fill="none" stroke="#303030" stroke-width="3"/>
<text x="704" y="485" font-size="29" font-weight="700" fill="#303030" text-anchor="start">已提交</text>
<text x="648" y="538" font-size="23" font-weight="400" fill="#303030" text-anchor="start">系统已确认接收，可查看提交记录。</text>
<rect x="48" y="610" width="528" height="151" rx="12" fill="#fff1f2" stroke="#8f2f39"/>
<path d="M 90 637 L 112 676 L 68 676 Z" fill="none" stroke="#8f2f39" stroke-width="3"/>
<line x1="90" y1="649" x2="90" y2="662" stroke="#8f2f39" stroke-width="3"/>
<circle cx="90" cy="669" r="2" fill="#8f2f39"/>
<text x="128" y="668" font-size="29" font-weight="700" fill="#8f2f39" text-anchor="start">提交失败</text>
<text x="72" y="721" font-size="23" font-weight="400" fill="#8f2f39" text-anchor="start">草稿仍保留，可重试提交。</text>
<rect x="624" y="610" width="528" height="151" rx="12" fill="#efefef" stroke="#303030"/>
<path d="M 666 637 L 688 676 L 644 676 Z" fill="none" stroke="#303030" stroke-width="3"/>
<line x1="666" y1="649" x2="666" y2="662" stroke="#303030" stroke-width="3"/>
<circle cx="666" cy="669" r="2" fill="#303030"/>
<text x="704" y="668" font-size="29" font-weight="700" fill="#303030" text-anchor="start">提交失败</text>
<text x="648" y="721" font-size="23" font-weight="400" fill="#303030" text-anchor="start">草稿仍保留，可重试提交。</text>
<rect x="48" y="823" width="1104" height="111" rx="12" fill="white" stroke="#c8d4cb"/>
<text x="74" y="863" font-size="25" font-weight="700" fill="#203c3b" text-anchor="start">文案必须跟真实结果一致。</text>
<text x="74" y="904" font-size="22" font-weight="400" fill="#203c3b" text-anchor="start">“已保存”“已提交”“仍保留”都需要对应证据；颜色不能替代事实。</text>
<line x1="48" y1="968" x2="1152" y2="968" stroke="#c8d4cb" stroke-width="1"/>
<text x="48" y="1004" font-size="17" font-weight="400" fill="#526a65" text-anchor="start">原创场景与构图 · 静态说明图，不是已运行产品或完整无障碍验收</text>
</svg>
