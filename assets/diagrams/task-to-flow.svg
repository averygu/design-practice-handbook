<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="880" viewBox="0 0 1200 880" role="img" aria-labelledby="title desc">
<title id="title">从任务骨架到具体流程与迭代</title><desc id="desc">原创课程提交示例：先明确输入、动作、结果，再设计草稿、检查、提交中和提交成功；失败保留答案并重试。设计、实现、试用与修正构成循环。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#58706d" stroke-width="1.5"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#203c3b}.muted{fill:#58706d}.serif{font-family:"Songti SC","Noto Serif CJK SC",serif}</style>
<rect width="1200" height="880" fill="#f6f7f3"/>
<text x="48" y="54" font-size="31" font-weight="700">01 / 先确定任务，再让流程接受检查</text>
<text x="48" y="91" font-size="19" font-weight="400" class="muted">原创示意 · 课程提交 · 不代表已经实现或完成用户测试</text>
<rect x="48" y="122" width="1104" height="160" rx="18" fill="#e7eee7" stroke="#cad7cf"/>
<text x="72" y="159" font-size="25" font-weight="650">任务：提交一次课堂练习，并确认收到的是哪一版</text>
<text x="72" y="204" font-size="18" font-weight="600" class="muted">输入</text>
<text x="72" y="243" font-size="25" font-weight="600">练习与答案</text>
<text x="430" y="204" font-size="18" font-weight="600" class="muted">动作</text>
<text x="430" y="243" font-size="25" font-weight="600">检查、修改、提交</text>
<text x="788" y="204" font-size="18" font-weight="600" class="muted">结果</text>
<text x="788" y="243" font-size="25" font-weight="600">可确认的已交版本</text>
<text x="48" y="328" font-size="24" font-weight="700">任务成为具体状态</text>
<rect x="48" y="352" width="261" height="119" rx="14" fill="#fff" stroke="#cad7cf"/>
<text x="70" y="395" font-size="26" font-weight="650">草稿</text>
<text x="70" y="435" font-size="20" font-weight="400" class="muted">可继续编辑</text>
<rect x="329" y="352" width="261" height="119" rx="14" fill="#fff" stroke="#cad7cf"/>
<text x="351" y="395" font-size="26" font-weight="650">检查</text>
<text x="351" y="435" font-size="20" font-weight="400" class="muted">明确内容与后果</text>
<rect x="610" y="352" width="261" height="119" rx="14" fill="#fff" stroke="#cad7cf"/>
<text x="632" y="395" font-size="26" font-weight="650">提交中</text>
<text x="632" y="435" font-size="20" font-weight="400" class="muted">显示真实等待</text>
<rect x="891" y="352" width="261" height="119" rx="14" fill="#fff" stroke="#cad7cf"/>
<text x="913" y="395" font-size="26" font-weight="650">提交成功</text>
<text x="913" y="435" font-size="20" font-weight="400" class="muted">确认已交版本</text>
<path d="M309 412 L323 412" fill="none" stroke="#58706d" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M590 412 L604 412" fill="none" stroke="#58706d" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M871 412 L885 412" fill="none" stroke="#58706d" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="470" y="515" width="365" height="92" rx="14" fill="#fff2e9" stroke="#d2bba8"/>
<text x="493" y="551" font-size="23" font-weight="650">失败：保留答案</text>
<text x="493" y="583" font-size="20" font-weight="400" class="muted">说明原因，允许修改或重试</text>
<path d="M740 471 L740 505" fill="none" stroke="#58706d" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M470 563 L390 563 L390 480" fill="none" stroke="#58706d" stroke-width="2" marker-end="url(#arrow)"/>
<text x="92" y="547" font-size="20" font-weight="500" class="muted">恢复路径也属于</text>
<text x="92" y="578" font-size="20" font-weight="500" class="muted">这个任务的范围</text>
<rect x="48" y="656" width="1104" height="169" rx="18" fill="#203c3b" stroke="#203c3b"/>
<text x="72" y="694" font-size="23" font-weight="650" fill="#ffffff" style="fill:#ffffff">每轮只推进一个可判断的改变</text>
<text x="75" y="746" font-size="25" font-weight="600" fill="#ffffff" style="fill:#ffffff">画出关系</text>
<text x="342" y="746" font-size="25" font-weight="600" fill="#ffffff" style="fill:#ffffff">做出流程</text>
<text x="609" y="746" font-size="25" font-weight="600" fill="#ffffff" style="fill:#ffffff">观察试用</text>
<text x="876" y="746" font-size="25" font-weight="600" fill="#ffffff" style="fill:#ffffff">修正与保留</text>
<path d="M248 738 L307 738" fill="none" stroke="#b7cdc5" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M515 738 L574 738" fill="none" stroke="#b7cdc5" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M782 738 L841 738" fill="none" stroke="#b7cdc5" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M1032 758 L1032 779 L100 779 L100 758" fill="none" stroke="#58706d" stroke-width="2" marker-end="url(#arrow)"/>
<text x="451" y="812" font-size="17" font-weight="500" fill="#c5d9d0" style="fill:#c5d9d0">根据观察，进入下一轮</text>
</svg>
