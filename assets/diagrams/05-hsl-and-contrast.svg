<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1040" viewBox="0 0 1200 1040" role="img" aria-labelledby="title desc">
<title id="title">HSL明度相同，文字对比仍会不同</title><desc id="desc">两种色相为160与280的色块，各呈现白字和黑字。对比值分别约为2.85与7.37，以及7.83与2.68。相同HSL明度不保证相同文字对比；数值由指定参数计算，不是显示器测量。</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif}</style>
<rect width="1200" height="1040" fill="#f6f7f3"/>
<text x="48" y="52" font-size="17" font-weight="700" fill="#315e54" text-anchor="start">图 14 · 原创示意 / 颜色与状态</text>
<text x="48" y="106" font-size="36" font-weight="700" fill="#203c3b" text-anchor="start">HSL明度相同，文字对比仍会不同</text>
<text x="48" y="150" font-size="21" font-weight="400" fill="#526a65" text-anchor="start">计算条件：不透明 sRGB · S = 70% · L = 40% · 前景为纯白或纯黑。</text>
<text x="48" y="214" font-size="25" font-weight="700" fill="#203c3b" text-anchor="start">H 160° / S 70% / L 40%</text>
<rect x="48" y="244" width="528" height="280" rx="12" fill="rgb(30.6,173.4,125.8)" stroke="rgb(30.6,173.4,125.8)"/>
<text x="78" y="304" font-size="30" font-weight="700" fill="#ffffff" text-anchor="start">纯白文字</text>
<text x="78" y="354" font-size="27" font-weight="400" fill="#ffffff" text-anchor="start">对白色 2.85:1</text>
<line x1="78" y1="388" x2="546" y2="388" stroke="#ffffff" stroke-width="1"/>
<text x="78" y="440" font-size="30" font-weight="700" fill="#000000" text-anchor="start">纯黑文字</text>
<text x="78" y="490" font-size="27" font-weight="400" fill="#000000" text-anchor="start">对黑色 7.37:1</text>
<rect x="48" y="548" width="528" height="152" rx="12" fill="white" stroke="#c8d4cb"/>
<text x="72" y="587" font-size="23" font-weight="700" fill="#203c3b" text-anchor="start">相对亮度 Y = 0.31827114</text>
<text x="72" y="627" font-size="21" font-weight="400" fill="#526a65" text-anchor="start">白 / 黑：两种分别计算的前景</text>
<text x="72" y="666" font-size="21" font-weight="400" fill="#526a65" text-anchor="start">色块中的不足对比刻意保留供比较</text>
<text x="624" y="214" font-size="25" font-weight="700" fill="#203c3b" text-anchor="start">H 280° / S 70% / L 40%</text>
<rect x="624" y="244" width="528" height="280" rx="12" fill="rgb(125.8,30.6,173.4)" stroke="rgb(125.8,30.6,173.4)"/>
<text x="654" y="304" font-size="30" font-weight="700" fill="#ffffff" text-anchor="start">纯白文字</text>
<text x="654" y="354" font-size="27" font-weight="400" fill="#ffffff" text-anchor="start">对白色 7.83:1</text>
<line x1="654" y1="388" x2="1122" y2="388" stroke="#ffffff" stroke-width="1"/>
<text x="654" y="440" font-size="30" font-weight="700" fill="#000000" text-anchor="start">纯黑文字</text>
<text x="654" y="490" font-size="27" font-weight="400" fill="#000000" text-anchor="start">对黑色 2.68:1</text>
<rect x="624" y="548" width="528" height="152" rx="12" fill="white" stroke="#c8d4cb"/>
<text x="648" y="587" font-size="23" font-weight="700" fill="#203c3b" text-anchor="start">相对亮度 Y = 0.08412279</text>
<text x="648" y="627" font-size="21" font-weight="400" fill="#526a65" text-anchor="start">白 / 黑：两种分别计算的前景</text>
<text x="648" y="666" font-size="21" font-weight="400" fill="#526a65" text-anchor="start">色块中的不足对比刻意保留供比较</text>
<rect x="48" y="732" width="1104" height="182" rx="12" fill="#e9f0ea" stroke="#c8d4cb"/>
<text x="76" y="776" font-size="26" font-weight="700" fill="#203c3b" text-anchor="start">比较的是前景与背景，不是一个孤立的颜色。</text>
<text x="76" y="820" font-size="22" font-weight="400" fill="#203c3b" text-anchor="start">显示数值取两位小数；阈值判断使用未取整的计算结果。</text>
<text x="76" y="860" font-size="22" font-weight="400" fill="#203c3b" text-anchor="start">若改用取整色值、透明度或其他背景，需要重新计算。</text>
<text x="76" y="896" font-size="20" font-weight="400" fill="#526a65" text-anchor="start">此例不建立色相的永久明暗排名，也不是色觉障碍模拟。</text>
<line x1="48" y1="968" x2="1152" y2="968" stroke="#c8d4cb" stroke-width="1"/>
<text x="48" y="1004" font-size="17" font-weight="400" fill="#526a65" text-anchor="start">原创参数与独立计算 · 图像仅示意颜色差异，不是显示器测量或完整合规结论</text>
</svg>
