<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
<title id="title">每条线都应有工作，焦点需要单独保留</title><desc id="desc">左右相同反馈列表含两项待讲评练习，位置字号内容一致。左侧为标题、两行内容和操作区域分别加框；右侧去掉这些内部框线，依靠对齐和间距表达分组。两侧开始讲评按钮均保留焦点环。</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif}</style>
<rect width="1200" height="1200" fill="#f6f7f3"/>
<text x="48" y="52" font-size="17" font-weight="700" fill="#315e54" text-anchor="start">图 22 · 原创示意 / 收尾与真实状态</text>
<text x="48" y="106" font-size="36" font-weight="700" fill="#203c3b" text-anchor="start">每条线都应有工作，焦点需要单独保留</text>
<text x="48" y="148" font-size="21" font-weight="400" fill="#526a65" text-anchor="start">相同内容、位置与字号；右侧减少内部框线，保留操作焦点的示意。</text>
<text x="48" y="216" font-size="26" font-weight="700" fill="#203c3b" text-anchor="start">重复框线较多</text>
<rect x="48" y="246" width="528" height="604" rx="12" fill="white" stroke="#c8d4cb"/>
<rect x="72" y="270" width="480" height="96" rx="7" fill="white" stroke="#c8d4cb"/>
<text x="92" y="309" font-size="28" font-weight="700" fill="#203c3b" text-anchor="start">练习讲评</text>
<text x="92" y="346" font-size="20" font-weight="400" fill="#526a65" text-anchor="start">待反馈 2 项</text>
<rect x="72" y="375" width="480" height="136" rx="7" fill="white" stroke="#c8d4cb"/>
<text x="92" y="413" font-size="25" font-weight="650" fill="#203c3b" text-anchor="start">01  补出具体原因</text>
<text x="92" y="453" font-size="21" font-weight="400" fill="#526a65" text-anchor="start">状态：未讲评</text>
<rect x="72" y="535" width="480" height="136" rx="7" fill="white" stroke="#c8d4cb"/>
<text x="92" y="573" font-size="25" font-weight="650" fill="#203c3b" text-anchor="start">02  检查论据关联</text>
<text x="92" y="613" font-size="21" font-weight="400" fill="#526a65" text-anchor="start">状态：未讲评</text>
<rect x="72" y="710" width="480" height="110" rx="7" fill="white" stroke="#c8d4cb"/>
<rect x="86" y="734" width="220" height="66" rx="10" fill="none" stroke="#315e54" stroke-width="3"/>
<rect x="92" y="740" width="208" height="54" rx="7" fill="#315e54" stroke="#315e54"/>
<text x="196.0" y="775" font-size="21" font-weight="650" fill="white" text-anchor="middle">开始讲评</text>
<text x="624" y="216" font-size="26" font-weight="700" fill="#203c3b" text-anchor="start">按关系减少框线</text>
<rect x="624" y="246" width="528" height="604" rx="12" fill="white" stroke="#c8d4cb"/>
<text x="668" y="309" font-size="28" font-weight="700" fill="#203c3b" text-anchor="start">练习讲评</text>
<text x="668" y="346" font-size="20" font-weight="400" fill="#526a65" text-anchor="start">待反馈 2 项</text>
<text x="668" y="413" font-size="25" font-weight="650" fill="#203c3b" text-anchor="start">01  补出具体原因</text>
<text x="668" y="453" font-size="21" font-weight="400" fill="#526a65" text-anchor="start">状态：未讲评</text>
<text x="668" y="573" font-size="25" font-weight="650" fill="#203c3b" text-anchor="start">02  检查论据关联</text>
<text x="668" y="613" font-size="21" font-weight="400" fill="#526a65" text-anchor="start">状态：未讲评</text>
<rect x="662" y="734" width="220" height="66" rx="10" fill="none" stroke="#315e54" stroke-width="3"/>
<rect x="668" y="740" width="208" height="54" rx="7" fill="#315e54" stroke="#315e54"/>
<text x="772.0" y="775" font-size="21" font-weight="650" fill="white" text-anchor="middle">开始讲评</text>
<text x="76" y="894" font-size="21" font-weight="400" fill="#526a65" text-anchor="start">线更多，不代表结构更容易理解。</text>
<text x="652" y="894" font-size="21" font-weight="400" fill="#526a65" text-anchor="start">去掉分组装饰线，不等于删除焦点。</text>
<rect x="48" y="950" width="1104" height="126" rx="12" fill="#e9f0ea" stroke="#e9f0ea"/>
<text x="76" y="992" font-size="26" font-weight="700" fill="#203c3b" text-anchor="start">先检查：装饰、分组、控件边界，还是状态？</text>
<text x="76" y="1035" font-size="21" font-weight="400" fill="#526a65" text-anchor="start">本图未比较用户效果；长内容、密集数据与强制颜色模式仍需单独验收。</text>
<line x1="48" y1="1128" x2="1152" y2="1128" stroke="#c8d4cb" stroke-width="1"/>
<text x="48" y="1164" font-size="17" font-weight="400" fill="#526a65" text-anchor="start">原创场景与文案 · 静态示意，不代表真实产品、用户记录或无障碍验收</text>
</svg>
